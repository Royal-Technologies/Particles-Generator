<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>tsParticles Generator</title>
  <script src="https://cdn.jsdelivr.net/npm/tsparticles@2.11.1/tsparticles.bundle.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    html, body {
      margin: 0; padding: 0; height: 100%;
    }
    #tsparticles {
      position: absolute;
      width: 100%;
      height: 100%;
      z-index: -1;
    }
  </style>
</head>
<body class="bg-gray-100">
  <div class="flex h-screen">
    <!-- Controls -->
    <div class="w-full md:w-1/2 lg:w-1/3 bg-white p-6 overflow-y-auto z-10">
      <h1 class="text-2xl font-bold mb-6">tsParticles Generator</h1>

      <div>
        <label class="block font-medium mb-1">Presets</label>
        <select id="presetSelect" class="w-full p-2 border rounded mb-4">
          <option value="custom">-- Custom --</option>
          <option value="snow">❄ Snow</option>
          <option value="stars">⭐ Stars</option>
          <option value="bubbles">🫧 Bubbles</option>
        </select>
      </div>

      <div class="mb-4">
        <label class="block font-medium mb-1">Background Color (Preview only)</label>
        <input type="color" id="bgColor" value="#000000" class="w-full h-10" />
      </div>

      <div class="space-y-4">
        <div class="custom-control">
          <label class="block font-medium mb-1">Particle Count</label>
          <input type="number" id="particleCount" value="800" class="w-full p-2 border rounded" />
        </div>

        <div class="custom-control">
          <label class="block font-medium mb-1">Particle Color</label>
          <input type="color" id="particleColor" value="#ffffff" class="w-full h-10" />
        </div>

        <div class="custom-control">
          <label class="block font-medium mb-1">Shape</label>
          <select id="particleShape" class="w-full p-2 border rounded">
            <option value="circle">Circle</option>
            <option value="square">Square</option>
            <option value="triangle">Triangle</option>
            <option value="star">Star</option>
            <option value="polygon">Polygon</option>
          </select>
        </div>

        <div class="custom-control">
          <label class="block font-medium mb-1">Speed</label>
          <input type="number" id="particleSpeed" value="2" step="0.1" class="w-full p-2 border rounded" />
        </div>

        <div class="custom-control">
          <label class="block font-medium mb-1">Size</label>
          <input type="range" id="particleSize" min="1" max="10" value="3" class="w-full" />
        </div>

        <div class="custom-control flex items-center space-x-2">
          <input type="checkbox" id="particleLinks" checked />
          <label for="particleLinks" class="font-medium">Enable Links</label>
        </div>

        <div class="custom-control">
          <label class="block font-medium mb-1">Hover Effect</label>
          <select id="hoverMode" class="w-full p-2 border rounded">
            <option value="repulse">Repulse</option>
            <option value="grab">Grab</option>
            <option value="bubble">Bubble</option>
            <option value="attract">Attract</option>
          </select>
        </div>

        <div class="custom-control">
          <label class="block font-medium mb-1">Click Effect</label>
          <select id="clickMode" class="w-full p-2 border rounded">
            <option value="push">Push</option>
            <option value="remove">Remove</option>
            <option value="repulse">Repulse</option>
            <option value="bubble">Bubble</option>
          </select>
        </div>
      </div>

      <textarea id="jsonOutput" class="w-full h-64 mt-6 p-2 border rounded font-mono text-sm" readonly></textarea>

      <button onclick="copyJSON()" class="w-full bg-green-600 hover:bg-green-700 text-white font-bold py-2 px-4 rounded mt-2">
        📋 Copy JSON
      </button>
      <button onclick="downloadJSON()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-2 px-4 rounded mt-2">
        ⬇️ Download JSON
      </button>
    </div>

    <!-- Preview -->
    <div class="w-full hidden md:block relative">
      <div id="tsparticles"></div>
    </div>
  </div>

  <script>
    const presets = {
      snow: {
        particles: {
          number: { value: 200, density: { enable: true } },
          color: { value: "#ffffff" },
          shape: { type: "circle" },
          opacity: { value: 0.8 },
          size: { value: { min: 1, max: 4 } },
          move: { enable: true, speed: 1, direction: "bottom" },
          links: { enable: false }
        },
        interactivity: {
          events: {
            onHover: { enable: false },
            onClick: { enable: false }
          }
        },
        detectRetina: true
      },
      stars: {
        particles: {
          number: { value: 120 },
          color: { value: "#ffffff" },
          shape: { type: "star" },
          opacity: { value: 0.7 },
          size: { value: { min: 2, max: 4 } },
          move: { enable: true, speed: 0.6 },
          links: { enable: true, distance: 150, opacity: 0.3 }
        },
        interactivity: {
          events: {
            onHover: { enable: true, mode: "grab" },
            onClick: { enable: true, mode: "push" }
          }
        },
        detectRetina: true
      },
      bubbles: {
        particles: {
          number: { value: 60 },
          color: { value: "#00d2ff" },
          shape: { type: "circle" },
          opacity: { value: 0.3 },
          size: { value: { min: 10, max: 20 } },
          move: { enable: true, speed: 1 },
          links: { enable: false }
        },
        interactivity: {
          events: {
            onHover: { enable: true, mode: "bubble" },
            onClick: { enable: true, mode: "repulse" }
          }
        },
        detectRetina: true
      }
    };

    function getSettings() {
      const selectedPreset = document.getElementById('presetSelect').value;
      const isCustom = selectedPreset === 'custom';

      document.querySelectorAll('.custom-control').forEach(control => {
        control.style.display = isCustom ? 'block' : 'none';
      });

      if (!isCustom) {
        return presets[selectedPreset];
      }

      return {
        particles: {
          number: {
            value: parseInt(document.getElementById('particleCount').value),
            density: { enable: true }
          },
          color: { value: document.getElementById('particleColor').value },
          shape: { type: document.getElementById('particleShape').value },
          opacity: { value: 0.5 },
          size: { value: parseInt(document.getElementById('particleSize').value) },
          links: {
            enable: document.getElementById('particleLinks').checked,
            distance: 150,
            color: "#ffffff",
            opacity: 0.4
          },
          move: {
            enable: true,
            speed: parseFloat(document.getElementById('particleSpeed').value)
          }
        },
        interactivity: {
          events: {
            onHover: { enable: true, mode: document.getElementById('hoverMode').value },
            onClick: { enable: true, mode: document.getElementById('clickMode').value }
          }
        },
        detectRetina: true
      };
    }

    function updatePreview() {
      const config = getSettings();
      const json = JSON.stringify(config, null, 2);
      document.getElementById('jsonOutput').value = json;

      document.getElementById('tsparticles').style.backgroundColor = document.getElementById('bgColor').value;

      tsParticles.load('tsparticles', config);
    }

    function copyJSON() {
      const textarea = document.getElementById('jsonOutput');
      textarea.select();
      document.execCommand('copy');
      alert('✅ JSON copied to clipboard');
    }

    function downloadJSON() {
      const json = document.getElementById('jsonOutput').value;
      const blob = new Blob([json], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'particles-config.json';
      a.click();
      URL.revokeObjectURL(url);
    }

    window.onload = () => {
      updatePreview();
      document.querySelectorAll('input, select').forEach(el => {
        el.addEventListener('input', updatePreview);
        el.addEventListener('change', updatePreview);
      });
    };
  </script>
</body>
</html>
